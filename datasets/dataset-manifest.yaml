        dblp_prefix_observed_in_release: false
    venue_prefix_verification: >-
      Only conf/sigir/ was observed in the bounded 16 MiB prefix of the
      release. The other 15 prefixes follow dblp's stream naming but are NOT
      verified; dblp_subset_stats.py reports prefixes_with_zero_works, and
      with --require-all-prefixes (used by verification_plan) it exits 3 if
      that list is non-empty or the input is truncated.
    openalex_source_mapping_verification: >-
      Each venue's openalex_source_id was resolved against the official
      OpenAlex API on 2026-11-12 (openalex_evidence); the returned id equalled
      the requested id and display_name is recorded verbatim.
      estimate_subset_openalex.py re-resolves every source id (16 venues + 3
      calibration venues) and aborts if the id or display_name differs. The
      mapping dblp prefix -> OpenAlex source is a manual judgement by
      dataset-engineer from the display names; OpenAlex may hold further
      sources for the same venue (for example per-year proceedings sources)
      that are not counted, which would bias the OpenAlex counts low.
  edge_definition_for_sizing: >-
    Pre-entity-resolution coauthor edge = unordered pair of distinct
    entity-decoded, whitespace-collapsed DBLP author name strings that occur
    together on at least one subset work (duplicates on one work counted once).
    This is the sizing definition only; the production edge model is owned by
    domain-engineer and spark-engineer.
  enrichment_restriction:
    openalex_works: "normalised OpenAlex doi is in the set of normalised DOIs from subset works' <ee> doi.org links"
    openalex_authors: "OpenAlex author id appears in authorships of a linked OpenAlex work"
    crossref_works: "normalised Crossref DOI is in the subset DOI set"
    orcid_records: "ORCID iD is a valid dblp author@orcid on a subset work, or a valid ORCID on a linked OpenAlex authorship or Crossref author"
  targets: {works_min: 100000, coauthor_edges_approx: 1000000}
  estimate:
    kind: estimate
    verified: false
    computed_on: "2026-11-12"
    works:
      openalex_count_2015_2025: 127818
      dblp_estimate_low: 123534
      dblp_estimate_high: 140371
    coauthor_edges:
      pair_instances_estimate: 1499982
      distinct_pairs_estimate_low: 1024488
      distinct_pairs_estimate_high: 1273485
      caveat: >-
        Distinct pairs are estimated per venue; pairs shared across venues are
        de-duplicated in the real measurement, so the true union is lower than
        the per-venue sum by an unmeasured amount.
    basis:
      - >-
        Step 1 (measured on DBLP): dblp_subset_stats.py over a 16 MiB HTTP
        Range prefix of dblp-2026-11-01.xml.gz. The prefix contains the
        complete, contiguous blocks of conf/sigir/, conf/dac/, conf/wcnc/ and
        conf/igarss/ (each followed by another venue's block). See
        calibration.measured_dblp_2015_2024.
      - >-
        Step 2 (measured on OpenAlex API, 2026-11-12): works per OpenAlex
        source with publication_year 2015-2024 and 2015-2025, and a
        100-work random sample (seed 20261112) per source for authors per work.
        Reproduce with estimate_subset_openalex.py.
      - >-
        Step 3 (derived): DBLP/OpenAlex count ratio on the four calibration
        venues ranges 0.966-1.098 (exact: 2422/2506 to 5468/4979); applied to
        the 2015-2025 OpenAlex total (127,818) of the 16 subset venues gives
        123,534-140,371 DBLP works.
      - >-
        Step 4 (derived): count-weighted mean pair instances per work from the
        OpenAlex samples is 11.74 (mean authors 4.74), giving about 1.50M
        pair instances. The DBLP-measured distinct/instance ratio on the
        calibration venues ranges 0.683-0.849, giving 1,024,488-1,273,485
        distinct pairs before cross-venue de-duplication. Values are the
        output of estimate_subset_openalex.py run on 2026-11-12.
      - >-
        Limits: 100-work samples have heavy-tailed author counts (one large
        author list moves a venue mean); DBLP and OpenAlex venue boundaries
        differ (e.g. workshops); 15 of 16 DBLP prefixes are unverified.
    calibration:
