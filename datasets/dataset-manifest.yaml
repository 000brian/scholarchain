# ScholarChain dataset manifest
# Owner: dataset-engineer (datasets/**). Validated by datasets/scripts/validate_datasets.py.
#
# Conventions
#   * Every fact below was observed on `checked_on` at the `evidence` URL(s).
#   * A value that could not be verified is the string "unknown" and MUST have a
#     sibling key "<field>_unknown_reason" (enforced by the validator).
#   * "estimate" values are never measurements; each carries `basis`.
#   * No bucket names, credentials, account IDs or contact addresses appear here.
#     S3 locations are templates; {raw_bucket} is resolved from configuration
#     (the configuration contract is owned by domain-engineer).
#   * Scripts never upload to or mutate AWS. Movement into S3 is done by
#     approved scripts under scripts/** (infra-engineer), not by datasets/**.

manifest_schema: scholarchain.dataset-manifest
manifest_version: 1
checked_on: "2026-11-12"
owner: dataset-engineer
validation_command: "bash datasets/scripts/validate.sh"
validation_note: "Offline. Runs bash -n on all datasets/scripts/*.sh, validate_datasets.py, and test_datasets.py."

s3_layout:
  bucket_resolution: "configuration; never hard-coded (placeholders {raw_bucket})"
  raw_zone_root_template: "s3://{raw_bucket}/raw/"
  rules:
    - "Raw objects are immutable; a new snapshot or retrieval gets a new prefix."
    - "Each raw prefix holds a _provenance.json written by the transfer script: dataset id, snapshot id, source URL, checksum, retrieved_at, subset_rule id."
    - "Curated-zone layout is defined by hadoop-engineer and domain-engineer, not here."

# ---------------------------------------------------------------------------
# Subset rule (bounded corpus). Status: proposed; requires human ratification.
# ---------------------------------------------------------------------------
subset_rule:
  id: dblp-subset-v1
  status: proposed
  summary: >-
    DBLP article and inproceedings records whose key starts with one of 16
    venue key prefixes (IR, web, data mining, databases, multimedia, vision,
    AI, NLP, ML), with 2015 <= year <= 2025, excluding records whose publtype
    contains "informal". Enrichment data is restricted to records that link
    to those works by normalised DOI or ORCID iD.
  dblp:
    record_elements: [article, inproceedings]
    year_min: 2015
    year_max: 2025
    exclude_publtype_tokens: [informal]
    key_prefix_semantics: >-
      A record is in a venue if its dblp key starts with dblp_key_prefix.
      Observed in the 2026-11-01 release: the conf/sigir/ block also contains
      co-located workshop papers (example conf/sigir/KemmererGMAE14,
      booktitle "ERD@SIGIR"). Workshop and companion volumes under the same
      prefix are therefore IN the subset unless a later rule version narrows it.
    venues:
      - dblp_key_prefix: "conf/sigir/"
        openalex_source_id: S4363608773
        openalex_display_name: "International ACM SIGIR Conference on Research and Development in Information Retrieval (SIGIR)"
        openalex_evidence: {url: "https://api.openalex.org/sources/S4363608773?select=id,display_name,type", checked_on: "2026-11-12", observed: "id resolves to itself (no merge redirect); type conference"}
        dblp_prefix_observed_in_release: true
      - dblp_key_prefix: "conf/kdd/"
        openalex_source_id: S4363608767
        openalex_display_name: "ACM SIGKDD Conference on Knowledge Discovery and Data Mining (KDD)"
        openalex_evidence: {url: "https://api.openalex.org/sources/S4363608767?select=id,display_name,type", checked_on: "2026-11-12", observed: "id resolves to itself (no merge redirect); type conference"}
        dblp_prefix_observed_in_release: false
      - dblp_key_prefix: "conf/www/"
        openalex_source_id: S7407088480
        openalex_display_name: "International World Wide Web Conference (WWW)"
        openalex_evidence: {url: "https://api.openalex.org/sources/S7407088480?select=id,display_name,type", checked_on: "2026-11-12", observed: "id resolves to itself (no merge redirect); type conference"}
