# ---------------------------------------------------------------------------
# Cross-dataset identifiers (field names are the contract input for
# domain-engineer; full rules in datasets/schemas/identifiers-and-linkage.md)
# ---------------------------------------------------------------------------
identifiers:
  dblp_key:
    format: "slash-separated path, e.g. conf/sigir/Sousa0J23; first two segments are the stream prefix"
    canonical: "verbatim value of the record element's key attribute (case-sensitive, no normalisation)"
    example: conf/sigir/Sousa0J23
  dblp_author_name:
    format: "entity-decoded <author> text; optional homonym suffix of a space and exactly 4 digits (e.g. 'Ricardo Campos 0001')"
    canonical: "decoded text with internal whitespace collapsed; homonym suffix kept as part of the name"
    example: "Ricardo Campos 0001"
  doi:
    format: "DOI name 10.<registrant>/<suffix>"
    canonical: "bare DOI, resolver prefix removed (https://doi.org/, http://doi.org/, http(s)://dx.doi.org/, doi:), percent-escapes decoded once for URL inputs, ASCII A-Z lowercased only"
    regex: '^10\.[0-9]+(\.[0-9]+)*/\S+$'
    example: "10.1109/dac56929.2023.10247992"
    evidence: "DOI Handbook 2025 PDF (https://www.doi.org/doi-handbook/DOIHandbook_2025.pdf): DOI names are case-insensitive only for U+0041..U+005A vs U+0061..U+007A"
  orcid:
    format: "16 characters in four hyphenated groups; last character digit or X; ISO 7064 11,2 check digit"
    canonical: "bare uppercase form 0000-0003-3226-9189 (no https://orcid.org/ prefix)"
    regex: '^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$'
    regex_note: "ASCII digits 0-9 only; non-ASCII decimal digits (e.g. U+0660..U+0669, U+FF10..U+FF19) are rejected, matching modules/core Orcid.Pattern"
    example: "0000-0003-3226-9189"
    evidence:
      - "ORCID v3.0 XSD orcid-path pattern (\\d{4}-){3,}\\d{3}[\\dX]: https://raw.githubusercontent.com/ORCID/orcid-model/master/src/main/resources/common_3.0/common-3.0.xsd"
      - "ISO 7064 11,2 implementation: https://raw.githubusercontent.com/ORCID/ORCID-Source/master/orcid-core/src/main/java/org/orcid/core/crypto/OrcidCheckDigitGenerator.java"
    note: "The XSD allows more than four groups; ScholarChain accepts exactly four (all observed iDs)."
  openalex_id:
    format: "entity letter + digits: W works, A authors, S sources, I institutions; case-insensitive"
    canonical: "uppercase key without https://openalex.org/ prefix"
    regex: '^[WASI][1-9][0-9]*$'
    example: "W4366851189"
    evidence: "https://help.openalex.org/how-to-use-the-api/get-single-entities"

# ---------------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------------
datasets:

  - id: dblp
    name: dblp computer science bibliography XML
    role: primary
    status: usable
    source:
      publisher: "Schloss Dagstuhl - Leibniz Center for Informatics"
      homepage: "https://dblp.org"
      access: "anonymous HTTPS; monthly persistent snapshots on Dagstuhl DROPS; rolling daily dump at https://dblp.org/xml/dblp.xml.gz"
      evidence:
        - {url: "https://dblp.org/xml/", checked_on: "2026-11-12", observed: "directory listing: dblp.xml.gz 1.0G (2026-11-12), dblp.xml.gz.md5, dblp.dtd 13K, release/ redirects to DROPS"}
        - {url: "https://drops.dagstuhl.de/entities/collection/10.4230/dblp.xml", checked_on: "2026-11-12", observed: "latest monthly releases 2026-11-01, 2026-10-03, 2026-09-01"}
        - {url: "https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-11-01", checked_on: "2026-11-12", observed: "file dblp-2026-11-01.xml.gz, 1.03 GB, MD5 18ad5db59592406ec74289975c4b44cb, license CC0 1.0"}
      api_note: "dblp.org search API and record pages were behind an Anubis bot challenge on 2026-11-12; not used, not bypassed."
    license:
      spdx: CC0-1.0
      name: "Creative Commons Zero 1.0 (secondary: ODC-BY 1.0)"
      url: "https://creativecommons.org/publicdomain/zero/1.0/"
      evidence:
        - {url: "https://dblp.org/xml/README.txt", checked_on: "2026-11-12", observed: "metadata ... XML ... released under the CC0 1.0 Public Domain Dedication license; also ODC-BY 1.0 as secondary license"}
        - {url: "https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-11-01", checked_on: "2026-11-12", observed: "Creative Commons Zero v1.0 Universal"}
      attribution: "Requested, not required: link to dblp (https://dblp.org) as the source."
    snapshot:
      id: "2026-11-01"
      doi: "10.4230/dblp.xml.2026-11-01"
      publication_date: "2026-11-01"
      url: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2026/dblp-2026-11-01.xml.gz"
      md5_url: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2026/dblp-2026-11-01.xml.gz.md5"
      http_last_modified: "Tue, 03 Nov 2026 09:01:15 GMT"
      dtd:
        declared_system_id: "dblp-2023-06-28.dtd"
        fetched_from: "https://dblp.org/xml/dblp.dtd"
        dated_file_available: false
        dated_file_note: "https://dblp.org/xml/dblp-2023-06-28.dtd and the DROPS equivalents returned HTTP 404 on 2026-11-12; dblp.dtd (listing date 2023-06-28) contains the 2023-06-28 rel@sort change, so it is assumed equivalent; equivalence is not verified."
    format:
      container: gzip (single member)
      encoding: "ISO-8859-1 declared; non-ASCII characters appear as named entities from the DTD (e.g. &eacute;) or numeric character references (e.g. &#1057;)"
      structure: "root <dblp>; one child element per record (article, inproceedings, proceedings, book, incollection, phdthesis, mastersthesis, www, data); records are written back-to-back, often several per line; records of one key prefix are contiguous (observed in prefix)"
      notes: datasets/schemas/dblp-xml.md
    size_estimate:
      compressed_bytes: 1116142729
      compressed_bytes_basis: "HTTP Content-Length of the snapshot URL on 2026-11-12 (measurement)"
      decompressed_bytes_estimate: 5490000000
      decompressed_bytes_basis: "estimate: compression ratio 4.92 observed on the first 16 MiB (16,777,216 -> 82,509,824 bytes) applied to the full file"
