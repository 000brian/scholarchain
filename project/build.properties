# ScholarChain dependency version ledger.
#
# This is the one file that pins every sbt, Scala, library, plugin, formatter, Java,
# and container-runtime version in the build. The sbt launcher reads only
# `sbt.version` from it. project/plugins.sbt and project/Ledger.scala read the rest.
#
# Ownership split (docs/agents.md, ownership resolution rule 3):
#   build-engineer      owns the structure: keys, comments, and how the build reads them.
#   dependency-updater  may change version values only.
#
# Rules, enforced when the build loads (project/Ledger.scala):
#   - every value is an exact version; no "latest", "+", ranges, or SNAPSHOT
#   - the container runtime image is pinned by tag and sha256 digest
#   - version.scalafmt must equal the `version` line in .scalafmt.conf (sbt ledgerCheck)
#
# Target runtime: Amazon EMR release emr-spark-8.1.0 (AWS runtime for Apache Spark).
#   Spark 4.1.1-amzn-0, Scala 2.13.17, Hadoop 3.4.2-amzn-3, Amazon Corretto 17 by default.
#   Spark and Hadoop below are the matching upstream Apache releases and are Provided scope.

sbt.version=1.13.1

# Languages and Java
version.java=17
version.scala3=3.3.9
version.scala213=2.13.17

# Runtime-provided (Provided scope; must match the EMR runtime above)
version.spark=4.1.1
version.hadoop=3.4.2

# Libraries
version.upickle=4.4.3
version.munit=1.3.6
version.slf4j=2.0.19
version.logback=1.6.6
# AWS SDK for Java 2.x: every software.amazon.awssdk artifact (storage and rag) uses this version
version.awssdk=2.59.1

# Formatter (mirrored in .scalafmt.conf `version`; sbt ledgerCheck enforces equality)
version.scalafmt=3.11.5

# sbt plugins
version.sbt-scalafmt=2.6.2
version.sbt-assembly=2.5.0
version.sbt-projectmatrix=0.11.0

# Container Java runtime for docker/** images (tag and digest)
image.java-runtime=eclipse-temurin:17.0.21_9-jre-noble@sha256:042c05a77eb915684fc8c92cfbbef4fd6f8c24ca7d934d1a7db3543453aaa077
