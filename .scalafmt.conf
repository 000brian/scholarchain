# Scalafmt configuration for ScholarChain.
# `version` mirrors version.scalafmt in project/build.properties (the version ledger);
# `sbt ledgerCheck`, part of `sbt check`, fails when they differ.
version = "3.11.5"

runner.dialect = scala3
maxColumn = 100

fileOverride {
  # Cross-built for Scala 3 and Scala 2.13 (instructor-approved deviation): the source must
  # parse and compile under both, so format it with the Scala 2.13 + Scala 3 source dialect.
  "glob:**/modules/core/src/**" {
    runner.dialect = scala213source3
  }
  # sparkAnalytics compiles with Scala 2.13 to match the Spark runtime.
  "glob:**/modules/spark/src/**" {
    runner.dialect = scala213source3
  }
  # sbt 1.x build definitions compile with Scala 2.12.
  "glob:**/project/*.scala" {
    runner.dialect = scala212source3
  }
  "glob:**/*.sbt" {
    runner.dialect = sbt1
  }
}
